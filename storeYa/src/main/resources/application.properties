# Load local secrets first. `[.properties]` parses the extension-less .env as a
# Java properties file, so it must live next to the working directory (storeYa/).
spring.config.import=optional:file:.env[.properties]

# App
spring.application.name=storeYa
server.port=8081
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Postgres (container name: postgres)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:training}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Keycloak (container name: keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/training-realm}
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:training-realm}
keycloak.resource=${KEYCLOAK_CLIENT_ID:training}
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET}

# Mail send otp
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:dz0dqy62d}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# VnPay
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:4200/payment-result}
vnpay.apiUrl=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.version=${VNPAY_VERSION:2.1.0}

# Comma-separated exact origins; no wildcards because CORS + credentials must not be open
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Rate limiting
security.trust-proxy=${TRUST_PROXY:false}
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:10}
security.rate-limit.ipn-per-minute=${RATE_LIMIT_IPN_PER_MINUTE:120}
security.rate-limit.otp-send-per-15min=${RATE_LIMIT_OTP_SEND:3}
security.rate-limit.otp-attempts=${RATE_LIMIT_OTP_ATTEMPTS:5}
