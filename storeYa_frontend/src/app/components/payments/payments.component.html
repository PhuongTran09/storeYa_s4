<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto mt-10 px-4">

    <div class="lg:col-span-2 space-y-6">

        <div class="bg-white p-6 rounded-xl space-y-5 border border-gray-200 shadow-md">

            <div class="flex items-center justify-between text-xl font-bold border-b pb-4 mb-3">
                <span class="text-gray-900">Thông tin nhận hàng</span>
                <a href="#" class="text-sky-600 text-sm font-medium hover:text-sky-700 transition">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
                </a>
            </div>

            <form class="space-y-4" (ngSubmit)="submitOrder()">

                <div>
                    <label for="recipientAddress" class="block text-sm font-semibold text-gray-700 mb-1">Địa chỉ giao
                        hàng</label>
                    <input id="recipientAddress" [(ngModel)]="payment.recipientAddress" name="recipientAddress" required
                        placeholder="Số nhà, tên đường, Phường/Xã, Quận/Huyện, Tỉnh/TP"
                        class="w-full border border-gray-300 px-3 py-2 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition duration-150" />
                </div>

                <div class="space-y-1">
                    <label for="recipientEmail" class="block text-sm font-medium text-gray-700">Email</label>
                    <input id="recipientEmail" [(ngModel)]="payment.recipientEmail" name="recipientEmail" type="email"
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-600 text-sm cursor-not-allowed"
                        disabled />
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="recipientName" class="block text-sm font-medium text-gray-700">Họ và tên</label>
                        <input id="recipientName" [(ngModel)]="payment.recipientName" name="recipientName" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-sky-500 focus:border-sky-500 transition" />
                    </div>
                    <div>
                        <label for="recipientPhone" class="block text-sm font-medium text-gray-700">Số điện
                            thoại</label>
                        <input id="recipientPhone" [(ngModel)]="payment.recipientPhone" name="recipientPhone" type="tel"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-sky-500 focus:border-sky-500 transition" />
                    </div>
                </div>

                <div>
                    <label for="details" class="block text-sm font-medium text-gray-700">Ghi chú (tùy chọn)</label>
                    <textarea id="details" [(ngModel)]="payment.details" name="details" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-1 focus:ring-sky-500 focus:border-sky-500 transition"
                        placeholder="Ví dụ: Giao hàng giờ hành chính..."></textarea>
                </div>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl space-y-4 border border-gray-200 shadow-md">
            <h3 class="text-xl font-bold text-gray-900 border-b pb-4">Chọn Phương thức thanh toán</h3>

            <div class="space-y-3">
                <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer transition"
                    [ngClass]="{'bg-sky-50 border-sky-500': payment.method === 'MOMO', 'border-gray-300 hover:border-sky-300': payment.method !== 'MOMO'}">
                    <div class="flex items-center gap-3">
                        <input type="radio" [(ngModel)]="payment.method" name="method" value="MOMO"
                            class="form-radio text-sky-600 w-5 h-5" />
                        <span class="font-medium text-gray-700">Thanh toán qua ví điện tử MoMo</span>
                    </div>
                    <i class="fa-solid fa-wallet text-xl text-sky-600"></i>
                </label>

                <label class="flex items-center justify-between p-3 border rounded-lg cursor-pointer transition"
                    [ngClass]="{'bg-sky-50 border-sky-500': payment.method === 'COD', 'border-gray-300 hover:border-sky-300': payment.method !== 'COD'}">
                    <div class="flex items-center gap-3">
                        <input type="radio" [(ngModel)]="payment.method" name="method" value="COD"
                            class="form-radio text-sky-600 w-5 h-5" checked />
                        <span class="font-medium text-gray-700">Thanh toán khi nhận hàng (COD)</span>
                    </div>
                    <i class="fa-solid fa-truck-fast text-xl text-sky-600"></i>
                </label>
            </div>
        </div>
    </div>

    <div class="bg-white p-6 rounded-xl border border-gray-200 h-fit lg:sticky top-10 space-y-2 shadow-md ">
        <h3 class="text-xl font-bold text-gray-900 border-b pb-2">Đơn hàng ({{ cartItems.length || 0 }} sản phẩm)</h3>

        <div class="max-h-60 overflow-y-auto px-2">
            <div *ngFor="let item of cartItems; let i = index"
                class="flex justify-between items-start pt-2 pb-3 border-b border-gray-100 last:border-b-0">
                <div class="flex items-start gap-3">
                    <div class="relative flex-shrink-0">
                        <img [src]="item.image" class="w-14 h-14 object-cover rounded-md border border-gray-200" />
                        <span
                            class="absolute -top-2 -left-2 bg-gray-800 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-white">
                            {{ item.quantity }}
                        </span>
                    </div>
                    <div class="leading-snug text-sm pt-1">
                        <p class="text-gray-900 font-medium line-clamp-2">
                            {{ item.productName }}
                        </p>
                    </div>
                </div>

                <div class="text-right flex-shrink-0 text-sm font-medium text-gray-900 ml-3 pt-1">
                    {{ item.price | vnd }}
                </div>
            </div>
        </div>



        <hr class="my-4 border-gray-200" />

        <div class="space-y-2 text-sm">
            <div class="flex justify-between text-gray-700">
                <span>Tạm tính</span>
                <span>{{ total | vnd }}</span>
            </div>

            <div class="flex justify-between border-b border-dashed pb-3">
                <span class="text-sm text-gray-500">Phí giao hàng:</span>
                <span class="text-sm font-medium text-green-600">Miễn phí</span>
            </div>
        </div>

        <hr class="my-4 border-gray-200" />

        <div class="flex justify-between font-extrabold text-xl mb-4">
            <span>TỔNG CỘNG</span>
            <span class="text-sky-600">{{ total | vnd }}</span>
        </div>

        <button (click)="submitOrder()"
            class="w-full bg-sky-600 text-white font-semibold py-3 rounded-lg hover:bg-sky-700 transition disabled:bg-sky-400 flex items-center justify-center gap-2">
            <i *ngIf="loading" class="fa-solid fa-spinner fa-spin-pulse"></i>
            {{ loading ? 'Đang xử lý...' : 'HOÀN TẤT ĐẶT HÀNG' }}
        </button>
        <a routerLink="/cart" class="block text-center text-sky-600 text-sm hover:text-sky-800 pt-2 transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Quay về giỏ hàng
        </a>
    </div>
</div>
