<div
  class="flex flex-col sm:flex-row sm:items-center justify-between p-4 bg-white rounded-xl shadow-md border border-gray-100 transition-shadow duration-300 hover:shadow-lg">

  <div class="flex flex-grow items-start gap-4 mb-3 sm:mb-0 ">

    <img [src]="item.image || 'assets/img/no-image.png'" alt="{{ item.productName }}"
      class="w-20 h-20 object-cover rounded-lg border border-gray-200" />

    <div class="flex flex-col justify-between h-full">
      <h3 class="font-semibold text-base sm:text-lg text-gray-800 line-clamp-2 
           hover:text-sky-500 hover:font-bold transition duration-300 cursor-pointer"
        routerLink="/product/{{ item.productId }}">
        {{ item.productName }}
      </h3>

      <p class="text-gray-500 text-sm mt-0.5">Giá: {{ item.price | vnd }}</p>

      <div class="flex items-center mt-3 border border-gray-300 rounded-lg overflow-hidden w-fit">
        <button (click)="decreaseQty()"
          class="px-2.5 py-1 text-gray-600 bg-white hover:bg-gray-100 transition disabled:opacity-30 font-semibold">
          −
        </button>
        <input type="text" [value]="item.quantity" min="1" readonly
          class="w-8 text-center text-sm font-medium border-x border-gray-300 outline-none bg-white cursor-default" />
        <button (click)="increaseQty()"
          class="px-2.5 py-1 text-gray-600 bg-white hover:bg-gray-100 transition font-semibold">
          +
        </button>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-between w-full sm:w-auto mt-3 sm:mt-0 sm:ml-4 sm:flex-col sm:items-end">

    <p class="font-extrabold text-lg text-sky-500">
      {{ (item.price * item.quantity) | vnd }}
    </p>

    <button (click)="onRemove()" class="p-2 text-red-500 rounded-full hover:bg-red-50 transition duration-200 sm:mt-1">
      <i class="fa-solid fa-trash-can text-sm"></i>
    </button>
  </div>
</div>
