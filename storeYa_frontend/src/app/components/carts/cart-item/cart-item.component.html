<div class="flex flex-col md:flex-row items-start justify-between p-4 border rounded-lg mb-4 bg-gray-50">

  <!-- Left column: image + info + quantity -->
  <div class="flex items-start gap-4 flex-1">
    <img [src]="item.image" [alt]="item.name" class="h-20 w-20 object-cover rounded border" />

    <div class="flex flex-col">
      <h3 class="font-semibold text-gray-800 hover:cursor-pointer hover:text-blue-600"
        [routerLink]="'/product/' + item.id">
        {{ item.name }}
      </h3>
      <p class="text-green-600 font-medium text-xs">Giá: {{ item.price | vnd }}</p>

      <!-- Quantity control -->
      <div class="flex items-center mt-2 border rounded w-fit overflow-hidden">
        <button (click)="changeQty(item, item.quantity - 1)"
          class="px-3 py-1 text-gray-700 hover:bg-gray-100 disabled:opacity-50"
          [disabled]="item.quantity <= 1">−</button>
        <input type="text" [value]="item.quantity" readonly
          class="w-12 text-center border-x outline-none bg-white cursor-default" />
        <button (click)="changeQty(item, item.quantity + 1)"
          class="px-3 py-1 text-gray-700 hover:bg-gray-100">+</button>
      </div>
    </div>
  </div>

  <!-- Right column: total + delete -->
  <div class="flex flex-col items-end mt-4 md:mt-0 md:ml-auto gap-2 w-full md:w-auto">
    <p class="font-semibold text-gray-800">{{ item.price * item.quantity | vnd }}</p>
    <button (click)="removeItem.emit(item.id)" class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">
      Xóa
    </button>
  </div>


</div>
