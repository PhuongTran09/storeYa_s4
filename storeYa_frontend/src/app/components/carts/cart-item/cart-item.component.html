<div class="flex items-center justify-between p-4 border-b border-gray-200">
  <div class="flex items-center gap-4">
    <img *ngIf="item.image" [src]="item.image" class="w-16 h-16 object-cover rounded">
    <div>
      <h3 class="font-semibold">{{ item.name }}</h3>
      <p class="text-gray-500">${{ item.price }}</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <input type="number" min="1" [value]="item.quantity"
           (change)="onQtyChange($event)" class="w-16 border rounded p-1 text-center">
    <button (click)="remove()" class="text-red-500 hover:text-red-700 font-bold">X</button>
  </div>
</div>
