<app-header></app-header>

<div class="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <h1 class="text-3xl font-bold text-gray-900 mb-8 text-center sm:text-left">
    GIỎ HÀNG CỦA BẠN
  </h1>

  <div *ngIf="cartItems.length > 0; else emptyCart" class="flex flex-col lg:flex-row gap-8">
    <!-- Danh sách sản phẩm -->
    <div class="lg:w-2/3 space-y-4">
      <div class="hidden md:grid grid-cols-2 font-semibold text-sm text-gray-500 border-b pb-2 px-4">
        <span>SẢN PHẨM</span>
        <span class="text-right">TỔNG</span>
      </div>


      <!-- Render từng item -->
      <app-cart-item *ngFor="let item of cartItems" [item]="item" (remove)="removeItem($event)"
        (updateQty)="updateQuantity($event)" class="p-2">
      </app-cart-item>
    </div>

    <!-- Tóm tắt đơn hàng -->
    <div class="lg:w-1/3 flex flex-col p-6 bg-white rounded-xl shadow-sm border border-gray-100 sticky top-24 h-fit hover:shadow-md transition-shadow duration-300">
      <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-3">
        TÓM TẮT ĐƠN HÀNG
      </h2>

      <div class="space-y-3 text-gray-700">
        <div class="flex justify-between">
          <span class="text-sm">Tạm tính ({{ cartItems.length }} sản phẩm):</span>
          <span class="text-sm font-medium">{{ total | vnd }}</span>
        </div>
        <div class="flex justify-between">
          <span class="text-sm">Phí giao hàng:</span>
          <span class="text-sm font-medium text-green-600">Miễn phí</span>
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-200">
          <span class="text-xl font-bold text-gray-900">Tổng cộng:</span>
          <span class="text-2xl font-extrabold text-sky-500">{{ total | vnd }}</span>
        </div>
      </div>

      <button class="px-6 py-3 bg-sky-500 text-white font-bold text-lg rounded-xl mt-8 shadow-md
               transition duration-300 transform hover:bg-sky-600 hover:scale-[1.01] focus:ring-4 focus:ring-sky-200"
        routerLink="/payments">
        TIẾN HÀNH THANH TOÁN
      </button>

      <div class="mt-4 text-center text-xs text-gray-500">
        <i class="fa-solid fa-lock mr-1"></i> Thanh toán an toàn qua SSL.
      </div>
    </div>
  </div>

  <!-- Khi giỏ hàng trống -->
  <ng-template #emptyCart>
    <div class="text-center py-20 bg-white rounded-xl shadow-md border border-gray-100">
      <i class="fa-solid fa-basket-shopping text-6xl text-gray-300 mb-4"></i>
      <p class="text-xl font-medium text-gray-700 mb-4">Giỏ hàng của bạn đang trống.</p>
      <button routerLink="/home"
        class="px-6 py-3 bg-sky-500 text-white font-bold rounded-full transition duration-300 hover:bg-sky-600">
        Tiếp tục mua sắm
      </button>
    </div>
  </ng-template>
</div>
