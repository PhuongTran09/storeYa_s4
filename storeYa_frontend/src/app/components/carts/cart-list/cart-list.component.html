<app-header></app-header>
<div class="container mx-auto py-8 px-8">
  <div *ngIf="cartItems.length > 0; else emptyCart" class="flex flex-col md:flex-row gap-4 bg-slate-50 p-6 rounded-lg">

    <!-- Left: Cart Items -->
    <div class="flex-1">
      <app-cart-item *ngFor="let item of cartItems" [item]="item" (removeItem)="removeItem($event)"
        (quantityChange)="updateQuantity($event)"></app-cart-item>
    </div>

    <!-- Right: Total & Checkout -->
    <div class="md:w-1/3 flex flex-col justify-between h-full">
      <!-- Total Box -->
      <div class="flex text-white justify-between items-center bg-green-500 p-3 rounded mb-4">
        <span class="text-xl font-semibold">Total:</span>
        <span class="text-xl font-semibold">{{ total | vnd }}</span>
      </div>

      <!-- Checkout Button -->
      <button class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 w-full mt-auto">
        Checkout
      </button>
    </div>
  </div>

  <ng-template #emptyCart>
    <p class="text-gray-500">Your cart is empty.</p>
  </ng-template>
</div>
