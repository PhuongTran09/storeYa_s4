<div class="p-0">
    
    <div class="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
        <h2 class="text-3xl font-extrabold text-gray-900">QUẢN LÝ DANH MỤC</h2>
        
        <button (click)="openAddCategory()" 
                class="px-5 py-2 bg-sky-500 text-white font-semibold rounded-lg
                       transition duration-200 hover:bg-sky-600 focus:ring-2 focus:ring-sky-200 flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Thêm Danh mục
        </button>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 overflow-hidden">
        
        <div class="max-h-[60vh] overflow-y-auto">
            <table class="min-w-full divide-y divide-gray-200">
                
                <thead class="bg-gray-50 sticky top-0 z-10 border-b border-gray-200">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/6">
                            ID
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-4/6">
                            Tên Danh mục
                        </th>
                        <th class="px-6 py-3 text-right text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/6">
                            Hành động
                        </th>
                    </tr>
                </thead>
                
                <tbody class="divide-y divide-gray-100">
                    <tr *ngFor="let category of categories" class="hover:bg-sky-50/50 transition duration-150">
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500 font-medium w-1/6">{{ category.id }}</td>
                        
                        <td class="px-6 py-3 text-sm text-gray-900 font-medium w-4/6">{{ category.name }}</td>
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm w-1/6">
                            <div class="flex gap-2 justify-end">
                                <button (click)="openEditCategory(category)"
                                    class="p-2 text-sky-600 hover:text-sky-800 rounded-full hover:bg-sky-100 transition duration-150">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button (click)="askDeleteCategory(category.id)"
                                    class="p-2 text-red-600 hover:text-red-800 rounded-full hover:bg-red-100 transition duration-150">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <div *ngIf="showAddForm" 
         class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
        
        <div class="bg-white rounded-xl border border-gray-200 w-full max-w-lg p-6 relative animate-slide-down">
            <button (click)="closeAddCategory()" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 transition">
              <i class="fa-solid fa-xmark fa-xl"></i>
            </button>
            
            <app-category-add
                [category]="selectedCategory"
                (saved)="reloadCategories()"
                (closeForm)="closeAddCategory()"
            ></app-category-add>
        </div>
    </div>

    <app-confirm-dialog
      *ngIf="confirmDeleteId !== null"
      title="Xác nhận Xóa Danh mục"
      message="Bạn có chắc chắn muốn xóa danh mục này? Thao tác này không thể hoàn tác!"
      [confirmText]="'Đồng ý, Xóa'"
      [cancelText]="'Hủy bỏ'"
      (confirmed)="deleteCategory()"
      (cancelled)="cancelDelete()"
    ></app-confirm-dialog>

</div>
