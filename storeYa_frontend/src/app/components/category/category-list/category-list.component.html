<div class="overflow-x-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-gray-700">CATEGORY MANAGEMENT</h2>
    <button
      (click)="openAddCategory()"
      class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600"
    >
      Add
    </button>
  </div>

  <!-- Table -->
  <div class="max-h-[500px] overflow-y-auto border rounded-lg justify-between">
    <table class="min-w-full bg-white">
      <thead class="bg-gray-100 sticky top-0 z-10">
        <tr>
          <th class="px-4 py-2 text-left">ID</th>
          <th class="px-4 py-2 text-center">Name</th>
          <th class="px-4 py-2 text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let category of categories"
          class="border-t hover:bg-gray-50"
        >
          <td class="px-4 py-2">{{ category.id }}</td>
          <td class="px-4 py-2 text-center">{{ category.name }}</td>
          <td class="px-4 py-2 flex gap-2 justify-end">
            <button
              (click)="openEditCategory(category)"
              class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600"
            >
              Edit
            </button>
            <button
              (click)="askDeleteCategory(category.id)"
              class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Form Add/Edit -->
  <div
    *ngIf="showAddForm"
    class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50"
  >
    <div
      class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6 relative animate-slide-down"
    >
      <button
        (click)="closeAddCategory()"
        class="absolute top-2 right-2 text-gray-500 hover:text-black"
      >
        <i class="fa-solid fa-square-xmark fa-2x"></i>
      </button>

      <app-category-add
        [category]="selectedCategory"
        (saved)="reloadCategories()"
        (closeForm)="closeAddCategory()"
      ></app-category-add>
    </div>
  </div>

 <app-confirm-dialog
  *ngIf="confirmDeleteId !== null"
  title="Are you sure?"
  message="Do you really want to delete this category?"
  [confirmText]="'Yes, Delete'"
  [cancelText]="'Cancel'"
  (confirmed)="deleteCategory()"
  (cancelled)="cancelDelete()"
></app-confirm-dialog>

</div>
