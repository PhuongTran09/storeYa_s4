<div class="p-6">
    
    <h2 class="text-2xl font-bold text-gray-900 mb-6">
        {{ category ? 'CHỈNH SỬA DANH MỤC' : 'THÊM DANH MỤC MỚI' }}
    </h2>

    <form (ngSubmit)="saveCategory()" class="space-y-6">
        
        <div>
            <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Tên Danh mục</label>
            <input id="name" [(ngModel)]="formData.name" name="name" type="text" 
                   placeholder="Ví dụ: Áo phông, Quần Jeans, Phụ kiện..."
                   class="w-full border border-gray-300 px-4 py-2.5 rounded-lg 
                          focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition duration-150" 
                   required />
        </div>

        <div class="pt-2 flex justify-end gap-3 border-t border-gray-100">
            
            <button type="button" (click)="cancel()" 
                    class="px-5 py-2.5 bg-gray-200 text-gray-700 font-medium rounded-lg 
                           hover:bg-gray-300 transition">
                Hủy
            </button>
            
            <button type="submit" [disabled]="saving" 
                    class="px-5 py-2.5 bg-sky-500 text-white font-semibold rounded-lg 
                           shadow-md transition duration-200 hover:bg-sky-600 focus:ring-2 focus:ring-sky-300 
                           disabled:bg-sky-300 disabled:shadow-none flex items-center gap-2">
                <i class="fa-solid fa-save"></i>
                {{ category ? 'Cập nhật' : 'Lưu' }}
            </button>
        </div>
    </form>
</div>

<app-confirm-dialog
  *ngIf="showConfirm"
  [title]="category ? 'Xác nhận Cập nhật' : 'Xác nhận Thêm mới'"
  [message]="category ? 'Bạn có chắc chắn muốn cập nhật danh mục này?' : 'Bạn có chắc chắn muốn thêm danh mục mới này?'"
  [confirmText]="'Xác nhận'"
  [cancelText]="'Hủy bỏ'"
  (confirmed)="onConfirmSave()"
  (cancelled)="onCancelSave()"
></app-confirm-dialog>
