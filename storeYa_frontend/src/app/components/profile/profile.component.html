<app-header></app-header>

<div class="max-w-5xl mx-auto mt-8 mb-12 px-3">

    <!-- Hàng trên -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div routerLink="/history-payment"
            class="bg-white rounded-lg shadow-sm p-4 border border-gray-100 flex flex-col items-center justify-center text-center hover:shadow-md cursor-pointer group">
            <i class="fa-solid fa-receipt text-sky-500 text-2xl mb-1 group-hover:scale-110 transition duration-200"></i>
            <h3 class="font-medium text-gray-700 text-sm">Lịch sử đơn hàng</h3>
        </div>

        <div
            class="bg-white rounded-lg shadow-sm p-4 border border-gray-100 flex flex-col items-center justify-center text-center hover:shadow-md">
            <i class="fa-solid fa-star text-indigo-500 text-2xl mb-1"></i>
            <p class="text-gray-700 text-sm">Xin chào, <span class="font-semibold text-sky-600">{{ user.username
                    }}</span>!</p>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-4 border border-gray-100 hover:shadow-md">
            <h3 class="text-base font-bold text-sky-600 mb-1">Thông tin tài khoản</h3>
            <p class="text-gray-700 text-sm"><span class="font-semibold">Họ tên:</span> {{ user.firstName }} {{
                user.lastName }}</p>
            <p class="text-gray-700 text-sm"><span class="font-semibold">Email:</span> {{ user.email }}</p>
        </div>
    </div>

    <!-- Hàng dưới -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

        <!-- Sidebar -->
        <div class="bg-white rounded-lg border border-gray-100 shadow-sm p-3">
            <ul class="space-y-1 text-gray-700 text-sm">
                <li class="flex items-center px-3 py-2 rounded-md text-sky-600 font-semibold border-b-2 border-sky-500">
                    <i class="fa-regular fa-user text-sm"></i>
                    <span class="ml-2 flex-1">Thông tin cá nhân</span>
                </li>
                <li class="flex items-center px-3 py-2 rounded-md hover:bg-sky-50 cursor-pointer">
                    <i class="fa-solid fa-key text-sm"></i>
                    <span class="ml-2 flex-1">Đổi mật khẩu</span>
                </li>
                <li routerLink="/cart"
                    class="flex items-center px-3 py-2 rounded-md hover:bg-sky-50 cursor-pointer text-sky-600 font-medium">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span class="ml-2 flex-1">Giỏ hàng</span>
                </li>
                <li (click)="logout()"
                    class="flex items-center px-3 py-2 rounded-md hover:bg-red-50 cursor-pointer text-red-500 font-medium">
                    <i class="fa-solid fa-right-from-bracket text-sm"></i>
                    <span class="ml-2 flex-1">Đăng xuất</span>
                </li>


            </ul>
        </div>

        <!-- Form -->
        <div class="md:col-span-3 bg-white p-5 rounded-lg border border-gray-100 shadow-sm">
            <h2 class="text-xl font-extrabold mb-4 text-gray-900 border-b pb-2">Thông tin tài khoản</h2>

            <form (ngSubmit)="save()" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="firstName" class="block text-xs font-semibold text-gray-700 mb-1">Họ</label>
                        <input id="firstName" [(ngModel)]="user.firstName" name="firstName" type="text"
                            placeholder="Nhập họ"
                            class="w-full border border-gray-300 px-3 py-2 rounded-md focus:ring-1 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    </div>
                    <div>
                        <label for="lastName" class="block text-xs font-semibold text-gray-700 mb-1">Tên</label>
                        <input id="lastName" [(ngModel)]="user.lastName" name="lastName" type="text"
                            placeholder="Nhập tên"
                            class="w-full border border-gray-300 px-3 py-2 rounded-md focus:ring-1 focus:ring-sky-500 focus:border-sky-500 text-sm">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-xs font-semibold text-gray-700 mb-1">Email (Không thể thay
                        đổi)</label>
                    <input id="email" [(ngModel)]="user.email" name="email" type="email" disabled
                        class="w-full border border-gray-200 px-3 py-2 rounded-md bg-gray-100 text-gray-500 cursor-not-allowed text-sm">
                </div>

                <div>
                    <label for="phone" class="block text-xs font-semibold text-gray-700 mb-1">Số điện thoại</label>
                    <input id="phone" [(ngModel)]="user.phone" name="phone" type="text" placeholder="Nhập số điện thoại"
                        class="w-full border border-gray-300 px-3 py-2 rounded-md focus:ring-1 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>

                <div>
                    <label for="address" class="block text-xs font-semibold text-gray-700 mb-1">Địa chỉ</label>
                    <input id="address" [(ngModel)]="user.address" name="address" type="text"
                        placeholder="Nhập địa chỉ của bạn"
                        class="w-full border border-gray-300 px-3 py-2 rounded-md focus:ring-1 focus:ring-sky-500 focus:border-sky-500 text-sm">
                </div>

                <button type="submit" [disabled]="saving"
                    class="w-full bg-sky-500 text-white font-semibold py-2.5 rounded-md shadow-sm hover:bg-sky-600 focus:ring-2 focus:ring-sky-200 disabled:bg-sky-300 disabled:cursor-not-allowed text-sm flex items-center justify-center gap-2">
                    <i *ngIf="saving" class="fa-solid fa-spinner fa-spin-pulse"></i>
                    {{ saving ? 'Đang lưu...' : 'Lưu thay đổi' }}
                </button>
            </form>
        </div>

    </div>
</div>

<app-confirm-dialog
  *ngIf="showLogoutConfirm"
  [title]="'Xác nhận đăng xuất'"
  [message]="'Bạn có chắc chắn muốn đăng xuất không?'"
  [confirmText]="'Có'"
  [cancelText]="'Không'"
  (confirmed)="onConfirmLogout()"
  (cancelled)="onCancelLogout()"
></app-confirm-dialog>
