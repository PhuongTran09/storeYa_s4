<div class="bg-white p-5 md:p-7 rounded-xl shadow-xl border border-gray-100 max-w-xl mx-auto">
    
    <h2 class="text-2xl font-extrabold mb-5 text-gray-900 border-b pb-3">
        {{ product ? 'CHỈNH SỬA SẢN PHẨM' : 'THÊM SẢN PHẨM MỚI' }}
    </h2>

    <form (ngSubmit)="saveProduct()" class="space-y-5" enctype="multipart/form-data">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Tên Sản phẩm</label>
                <input id="name" [(ngModel)]="formData.name" name="name" type="text" placeholder="Ví dụ: Áo thun Polo Cotton"
                        class="w-full border border-gray-300 px-4 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" required />
            </div>

            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Danh mục</label>
                <select id="category" [(ngModel)]="formData.categoryId" name="categoryId" required
                        class="w-full border border-gray-300 px-4 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 bg-white">
                    <option value="" disabled selected>— Chọn Danh mục —</option>
                    <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
                </select>
            </div>
            
            <div>
                <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Giá (VND)</label>
                <input id="price" [(ngModel)]="formData.price" name="price" type="number" placeholder="0"
                        class="w-full border border-gray-300 px-4 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" required />
            </div>

            <div>
                <label for="stock" class="block text-sm font-medium text-gray-700 mb-1">Tồn kho</label>
                <input id="stock" [(ngModel)]="formData.stock" name="stock" type="number" placeholder="0"
                        class="w-full border border-gray-300 px-4 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500" required />
            </div>

        </div>

        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Mô tả chi tiết</label>
            <textarea id="description" [(ngModel)]="formData.description" name="description" rows="3"
                        placeholder="Nhập mô tả sản phẩm..."
                        class="w-full border border-gray-300 px-4 py-2.5 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500"></textarea>
        </div>

        <div class="p-4 rounded-xl bg-gray-50 border border-dashed border-gray-300">
            <label class="block text-base font-semibold text-gray-700 mb-3">Ảnh Sản phẩm</label>
            
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <div class="flex items-center gap-3">
                    <input type="file" accept="image/png, image/jpeg" multiple (change)="onFileSelected($event)" class="hidden" #fileInput />
                    <button type="button" (click)="fileInput.click()"
                            class="px-5 py-2 bg-sky-500 text-white font-medium rounded-lg shadow-md hover:bg-sky-600 focus:ring-2 focus:ring-sky-300 transition flex items-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> Chọn tệp
                    </button>
                </div>
                <span class="text-sm text-gray-500">Tối đa 5 ảnh, định dạng JPG/PNG</span>
            </div>

            <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
                <div *ngFor="let file of selectedFiles; let i = index" class="relative w-full pb-[100%] rounded-lg overflow-hidden border-2 border-gray-300 hover:border-red-500 transition group">
                    <img [src]="file.preview" class="absolute inset-0 w-full h-full object-cover" />
                    <button type="button" (click)="removeFile(i)"
                            class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-lg opacity-0 group-hover:opacity-100 transition z-10">
                            <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="pt-4 flex flex-col sm:flex-row justify-end gap-3 border-t border-gray-100">
            <button type="button" (click)="closeForm.emit()"
                    class="px-5 py-2.5 bg-gray-200 text-gray-700 font-medium rounded-lg hover:bg-gray-300 transition w-full sm:w-auto">
                Hủy
            </button>
            
            <button type="submit"
                    class="px-5 py-2.5 bg-sky-500 text-white font-semibold rounded-lg shadow-md hover:bg-sky-600 focus:ring-2 focus:ring-sky-300 transition flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-save"></i>
                {{ product ? 'Cập nhật' : 'Lưu' }}
            </button>
        </div>

    </form>
</div>

<app-confirm-dialog
  *ngIf="showConfirm"
  [title]="product ? 'Xác nhận Cập nhật' : 'Xác nhận Thêm mới'"
  [message]="product ? 'Bạn có chắc chắn muốn cập nhật sản phẩm này?' : 'Bạn có chắc chắn muốn thêm sản phẩm mới này?'"
  [confirmText]="'Xác nhận'"
  [cancelText]="'Hủy bỏ'"
  (confirmed)="onConfirmSave()"
  (cancelled)="onCancelSave()"
></app-confirm-dialog>
