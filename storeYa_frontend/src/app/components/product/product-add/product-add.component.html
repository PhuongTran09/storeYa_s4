<div class="p-4 sm:p-6 md:p-8">
  <div class="bg-white p-6 md:p-8 rounded-lg shadow-md border border-gray-100 max-w-5xl mx-auto">

    <div class="mb-6">
      <h2 class="text-xl font-bold text-gray-800">
        {{ product ? 'Chỉnh sửa Sản phẩm' : 'Thêm Sản phẩm mới' }}
      </h2>
    </div>

    <form (ngSubmit)="saveProduct()" enctype="multipart/form-data">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-10">

        <div class="space-y-6">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="name">Tên sản phẩm</label>
              <input [(ngModel)]="formData.name" class="w-full bg-gray-50 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition" id="name" name="name"
                     placeholder="Ví dụ: Áo thun Polo Cotton"
                     required
                     type="text"/>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="category">Danh mục</label>
              <select [(ngModel)]="formData.categoryId" class="w-full bg-gray-50 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition appearance-none" id="category" name="categoryId"
                      required>
                <option disabled selected value="">— Chọn Danh mục —</option>
                <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="price">Giá (VND)</label>
              <input [(ngModel)]="formData.price" class="w-full bg-gray-50 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition" id="price" name="price" placeholder="0"
                     required
                     type="number"/>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="stock">Tồn kho</label>
              <input [(ngModel)]="formData.stock" class="w-full bg-gray-50 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition" id="stock" name="stock" placeholder="0"
                     required
                     type="number"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5" for="description">Mô tả chi tiết</label>
            <textarea [(ngModel)]="formData.description" class="w-full bg-gray-50 border border-gray-300 px-4 py-2 rounded-md focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition" id="description" name="description"
                      placeholder="Nhập các thông tin về chất liệu, kiểu dáng,..."
                      rows="8"></textarea>
          </div>
        </div>

        <div class="space-y-4 mt-6 lg:mt-0">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Ảnh sản phẩm</label>
            <label class="flex flex-col items-center justify-center w-full p-5 border-2 border-gray-300 border-dashed rounded-md cursor-pointer bg-gray-50 hover:bg-gray-100 transition"
                   for="file-upload">
              <div class="text-center">
                <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400"></i>
                <p class="mt-2 text-sm text-gray-600"><span class="font-semibold text-sky-600">Nhấn để chọn file</span>
                </p>
                <p class="text-xs text-gray-500 mt-1">Hỗ trợ JPG, PNG (Tối đa 5 ảnh)</p>
              </div>
            </label>
            <input (change)="onFileSelected($event)" accept="image/png, image/jpeg" class="hidden" id="file-upload"
                   multiple type="file"/>
          </div>

          <div *ngIf="selectedFiles.length > 0" class="grid grid-cols-3 sm:grid-cols-4 gap-3">
            <div *ngFor="let file of selectedFiles; let i = index"
                 class="relative w-full pb-[100%] rounded-md overflow-hidden border border-gray-200 group">
              <img [src]="file.preview" class="absolute inset-0 w-full h-full object-cover"/>
              <button (click)="removeFile(i)" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition-all duration-300 z-10"
                      type="button">
                            <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
                </div>
            </div>
        </div>

      <div class="pt-6 flex flex-col-reverse sm:flex-row justify-end gap-3 border-t border-gray-200 mt-8">
            <button type="button" (click)="closeForm.emit()"
                    class="px-5 py-2 bg-white text-gray-800 font-semibold rounded-md border border-gray-300 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition w-full sm:w-auto">
                Hủy
            </button>

            <button type="submit"
                    class="px-5 py-2 bg-sky-600 text-white font-semibold rounded-md shadow-sm hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-save"></i>
                {{ product ? 'Cập nhật' : 'Lưu' }}
            </button>
        </div>
    </form>
  </div>
</div>

<app-confirm-dialog
  *ngIf="showConfirm"
  [title]="product ? 'Xác nhận Cập nhật' : 'Xác nhận Thêm mới'"
  [message]="product ? 'Bạn có chắc chắn muốn cập nhật sản phẩm này?' : 'Bạn có chắc chắn muốn thêm sản phẩm mới này?'"
  [confirmText]="'Xác nhận'"
  [cancelText]="'Hủy bỏ'"
  (confirmed)="onConfirmSave()"
  (cancelled)="onCancelSave()"
></app-confirm-dialog>
