<div class="p-0">
    
    <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h2 class="text-3xl font-extrabold text-gray-900">QUẢN LÝ SẢN PHẨM</h2>
        
        <button (click)="openAddProduct()" 
                class="px-5 py-2 bg-sky-500 text-white font-semibold rounded-lg 
                       transition duration-200 hover:bg-sky-600 focus:ring-2 focus:ring-sky-300 flex items-center gap-2">
            <i class="fa-solid fa-plus"></i> Thêm Sản phẩm
        </button>
    </div>

    <div class="bg-white rounded-xl  border border-gray-100 overflow-hidden">
        
        <div class="max-h-[60vh] overflow-y-auto">
            <table class="min-w-full divide-y divide-gray-200">
                
                <thead class="bg-gray-50 sticky top-0 z-10">
                    <tr>
                        <ng-container *ngFor="let col of ['ID', 'Ảnh', 'Tên Sản phẩm', 'Danh mục', 'Giá', 'Tồn kho', 'Hành động']">
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">
                                {{ col }}
                            </th>
                        </ng-container>
                    </tr>
                </thead>
                
                <tbody class="divide-y divide-gray-100">
                    <tr *ngFor="let product of products" class="hover:bg-sky-50/50 transition duration-150">
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500 font-medium">{{ product.id }}</td>
                        
                        <td class="px-6 py-3 whitespace-nowrap">
                            <img [src]="product.imageUrls?.[0] || 'path/to/placeholder.jpg'" alt="{{ product.name }}" 
                                 class="w-10 h-10 object-cover rounded-md border border-gray-200" />
                        </td>

                        <td class="px-6 py-3">
                             <div class="text-sm font-semibold text-gray-900">{{ product.name }}</div>
                             <p class="text-xs text-gray-500 truncate max-w-xs" [title]="product.description">
                                 {{ product.description | truncate:30 }}
                             </p>
                        </td>
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm text-sky-600 font-medium">
                            {{ product.category?.name || 'N/A' }}
                        </td>
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm font-medium text-green-600">
                            {{ product.price | currency : "VND" }}
                        </td>
                        
                        <td class="px-6 py-3 whitespace-nowrap">
                             <span [class.text-red-500]="product.stock < 10" [class.text-gray-700]="product.stock >= 10" class="text-sm font-medium">
                                 {{ product.stock }}
                             </span>
                        </td>
                        
                        <td class="px-6 py-3 whitespace-nowrap text-sm">
                            <div class="flex gap-2">
                                <button (click)="openEditProduct(product)"
                                    class="p-2 text-sky-600 hover:text-sky-800 rounded hover:bg-sky-100 transition duration-150">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button (click)="askDeleteProduct(product.id!)"
                                    class="p-2 text-red-600 hover:text-red-800 rounded hover:bg-red-100 transition duration-150">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


    <div class="mt-6 flex justify-between items-center bg-white p-4 rounded-xl  border border-gray-100">
        <span class="text-sm text-gray-600 font-medium">
            Hiển thị {{ products.length }}  sản phẩm
        </span>
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)">
        </app-pagination>
    </div>


    <div *ngIf="showAddForm" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
        <app-product-add 
            [product]="selectedProduct" 
            (saved)="reloadProducts()" 
            (closeForm)="closeAddProduct()"
            class="animate-modal-in max-w-5xl mx-auto w-full"> 
        </app-product-add>
         <button (click)="closeAddProduct()" class="absolute top-4 right-4 text-white hover:text-gray-200 text-3xl hidden md:block">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <app-confirm-dialog *ngIf="confirmDeleteId !== null" 
                        title="Xác nhận Xóa Sản phẩm"
                        message="Bạn có chắc chắn muốn xóa sản phẩm này? Thao tác này không thể hoàn tác!" 
                        [confirmText]="'Đồng ý, Xóa'" 
                        [cancelText]="'Hủy bỏ'"
                        (confirmed)="deleteProduct()" 
                        (cancelled)="cancelDelete()">
    </app-confirm-dialog>

</div>
