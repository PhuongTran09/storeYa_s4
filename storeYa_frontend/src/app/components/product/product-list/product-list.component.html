<div class="overflow-x-auto p-4">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-gray-700">PRODUCT MANAGEMENT</h2>
    <button (click)="openAddProduct()" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
      Add
    </button>
  </div>

  <!-- Table scroll riêng -->
  <div class="max-h-[500px] overflow-y-auto border rounded-lg">
    <table class="min-w-full bg-white">
      <thead class="bg-gray-100 sticky top-0 z-10">
        <tr>
          <ng-container *ngFor="let col of ['ID', 'Name', 'Description', 'Price', 'Stock', 'Categories','Actions']">
            <th class="px-4 py-2 text-left">{{ col }}</th>
          </ng-container>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products " class="border-t hover:bg-gray-50">
          <td class="px-4 py-2">{{ product.id }}</td>
          <td class="px-4 py-2">{{ product.name }}</td>
          <td class="px-4 py-2" [title]="product.description">
            {{ product.description | truncate:50 }}
          </td>
          <td class="px-4 py-2">{{ product.price | currency : "VND" }}</td>
          <td class="px-4 py-2">{{ product.stock }}</td>
          <td class="px-4 py-2">{{ product.category?.name }}</td>
          <td class="px-4 py-2 flex gap-2">
            <button (click)="openEditProduct(product)"
              class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">Edit</button>
            <button (click)="askDeleteProduct(product.id!)"
              class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>


  <div class="fixed bottom-0 left-0 w-full  shadow-md p-4 flex justify-end space-x-2">
    <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)">
    </app-pagination>
  </div>


  <div *ngIf="showAddForm" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6 relative">
      <button (click)="closeAddProduct()" class="absolute top-2 right-2 text-gray-500 hover:text-black"><i
          class="fa-solid fa-square-xmark fa-2x"></i></button>

      <app-product-add [product]="selectedProduct" (saved)="reloadProducts()" (closeForm)="closeAddProduct()">
      </app-product-add>
    </div>
  </div>

   <app-confirm-dialog *ngIf="confirmDeleteId !== null" title="Are you sure?"
    message="Do you really want to delete this product?" [confirmText]="'Yes, Delete'" [cancelText]="'Cancel'"
    (confirmed)="deleteProduct()" (cancelled)="cancelDelete()"></app-confirm-dialog>

</div>
