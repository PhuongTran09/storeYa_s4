<div class="group  h-full flex flex-col rounded-xl overflow-hidden cursor-pointer p-3
          bg-white border border-gray-100 transition-all duration-300 ease-in-out 
          hover:shadow-lg hover:border-sky-400 hover:-translate-y-1 transform" (click)="goToDetail()">

  <div class="relative w-full h-52 overflow-hidden rounded-t-xl bg-gray-50">
    <div class="w-full h-full flex items-center justify-center">
      <img class="w-52 h-52 object-cover transition-transform duration-500 group-hover:scale-110 rounded-xl"
        [src]="product.imageUrls?.[0] || 'https://via.placeholder.com/400x200?text=No+Image'" [alt]="product.name" />
    </div>

    <div class="absolute top-3 left-3">
      <span class="px-2.5 py-1 text-xs font-semibold rounded-full uppercase tracking-wider transition duration-300"
        [ngClass]="{
                    'bg-green-50 text-green-700 border border-green-200': product.stock > 0,
                    'bg-red-500 text-white': product.stock === 0
                }">
        {{ product.stock > 0 ? 'Còn Hàng' : 'Hết Hàng' }}
      </span>
    </div>

    <div class="absolute bottom-0 inset-x-0 h-10 flex items-center justify-center 
                    transform translate-y-full group-hover:translate-y-0 opacity-0 group-hover:opacity-100 
                    transition-all duration-300 bg-black/10">
    </div>
  </div>

  <div class="flex-1 p-4 text-left">
    <h2 class="font-bold text-lg mb-1 text-gray-800 line-clamp-1 leading-snug">
      {{ product.name }}
    </h2>

    <p class="text-sm text-gray-400 mb-3 line-clamp-2">
      {{ product.description }}
    </p>

    <div class="flex justify-start items-center">
      <span class="text-sky-500 font-extrabold text-xl">
        {{ product.price | vnd }}
      </span>
    </div>
  </div>
</div>
