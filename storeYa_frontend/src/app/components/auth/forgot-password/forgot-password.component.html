<div class="flex justify-center items-center p-6 sm:p-8">
  <form [formGroup]="forgotForm" (ngSubmit)="resetPassword()"
    class="bg-white p-6 w-full max-w-md rounded-2xl border border-gray-100 ">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto mb-3 flex items-center justify-center rounded-full bg-sky-100">
        <i class="fa-solid fa-lock-open text-xl text-sky-500"></i>
      </div>
      <h2 class="font-extrabold text-3xl text-gray-900">
        Quên Mật Khẩu
      </h2>
      <p class="text-sm text-gray-500 mt-1">Nhập Email để nhận mã xác thực (OTP)</p>
    </div>

    <div class="mb-5">
      <div class="relative">
        <input id="email" type="email" formControlName="email" placeholder="Địa chỉ Email"
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
          [class.border-red-500]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid" />
        <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>
      </div>

    <div class="flex gap-3 mb-5">
      <div class="relative flex-1">
        <input id="otp" type="text" formControlName="otp" placeholder="Nhập Mã OTP"
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
          [class.border-red-500]="forgotForm.get('otp')?.touched && forgotForm.get('otp')?.invalid" />
        <i class="fa-solid fa-hashtag absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>
      
      <button type="button" (click)="sendOtp()" [disabled]="loading || countdown > 0 || forgotForm.get('email')?.invalid"
        class="w-28 px-3 py-3 rounded-lg bg-sky-500 text-white font-semibold text-sm transition duration-300 hover:bg-sky-600 
               disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed transform hover:scale-[1.01]">
        {{ countdown > 0 ? countdown + 's' : 'Gửi OTP' }}
      </button>
    </div>

    <div class="relative mb-6">
      <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
        placeholder="Mật khẩu mới"
        class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
        [class.border-red-500]="forgotForm.get('password')?.touched && forgotForm.get('password')?.invalid"
        (focus)="passwordFocused = true" (blur)="passwordFocused = false" />
      
      <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      
      <span *ngIf="passwordFocused || forgotForm.get('password')?.value" (click)="togglePasswordVisibility()"
        class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-sky-500 transition">
        <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
      </span>
    </div>

    <button type="submit" [disabled]="forgotForm.invalid"
      class="w-full py-3 bg-sky-500 text-white font-extrabold text-lg rounded-lg mt-5 transition duration-300 hover:bg-sky-600 
             disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed transform hover:scale-[1.01]">
      ĐẶT LẠI MẬT KHẨU
    </button>

    <div class="mt-6 text-center text-sm text-gray-600">
      <p>
        <a (click)="openLogin()" class="text-sky-500 font-bold hover:underline cursor-pointer transition">
          <i class="fa-solid fa-arrow-left-long mr-1"></i> Quay lại Đăng nhập
        </a>
      </p>
    </div>
  </form>
</div>
