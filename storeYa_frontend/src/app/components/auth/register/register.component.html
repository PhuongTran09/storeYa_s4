<div class="flex justify-center items-center p-6 sm:p-8">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()"
    class="bg-white p-6 w-full max-w-md rounded-2xl border border-gray-100 ">
    
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto mb-3 flex items-center justify-center rounded-full bg-sky-100">
        <i class="fa-solid fa-user-plus text-xl text-sky-500"></i>
      </div>
      <h2 class="font-extrabold text-3xl text-gray-900">
        Đăng Ký Tài Khoản
      </h2>
      <p class="text-sm text-gray-500 mt-1">Tạo tài khoản mới nhanh chóng</p>
    </div>

    <div class="mb-5">
      <div class="grid grid-cols-2 gap-3">
        <div class="relative">
          <input id="firstName" type="text" formControlName="firstName" placeholder="Tên"
            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
            [ngClass]="{ 'border-red-500': registerForm.get('firstName')?.touched && registerForm.get('firstName')?.invalid }" />
          <i class="fa-solid fa-file-signature absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
        <div class="relative">
          <input id="lastName" type="text" formControlName="lastName" placeholder="Họ"
            class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
            [ngClass]="{ 'border-red-500': registerForm.get('lastName')?.touched && registerForm.get('lastName')?.invalid }" />
           <i class="fa-solid fa-file-signature absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        </div>
      </div>
      <div class="text-red-500 text-xs mt-1 pl-1" *ngIf="errorMessages['firstName'] || errorMessages['lastName']">
        {{ errorMessages['firstName'] || errorMessages['lastName'] }}
      </div>
    </div>

    <div class="mb-5">
      <div class="relative">
        <input id="email" type="email" formControlName="email" placeholder="Địa chỉ Email"
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
          [ngClass]="{ 'border-red-500': registerForm.get('email')?.touched && registerForm.get('email')?.invalid }" />
        <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>
      <div class="text-red-500 text-xs mt-1 pl-1" *ngIf="errorMessages['email']">
        {{ errorMessages['email'] }}
      </div>
    </div>
    
    <div class="mb-5">
      <div class="relative">
        <input id="username" type="text" formControlName="username" placeholder="Tên đăng nhập"
          class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
          [ngClass]="{ 'border-red-500': registerForm.get('username')?.touched && registerForm.get('username')?.invalid }" />
        <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      </div>
      <div class="text-red-500 text-xs mt-1 pl-1" *ngIf="errorMessages['username']">
        {{ errorMessages['username'] }}
      </div>
    </div>

    <div class="mb-5 relative">
      <div class="relative">
        <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Mật khẩu"
          (focus)="passwordFocused = true" (blur)="passwordFocused = false"
          class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:border-sky-500 focus:ring-1 focus:ring-sky-500 focus:outline-none transition duration-200"
          [ngClass]="{ 'border-red-500': registerForm.get('password')?.touched && registerForm.get('password')?.invalid }" />
        
        <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        
        <span *ngIf="passwordFocused || registerForm.get('password')?.value" (click)="togglePasswordVisibility()"
          class="absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-sky-500 transition">
          <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
        </span>
      </div>
      <div class="text-red-500 text-xs mt-1 pl-1" *ngIf="errorMessages['password']">
        {{ errorMessages['password'] }}
      </div>
    </div>

    <div *ngIf="notifyMessage" class="text-sm text-center py-2 rounded-lg my-4 animate-fadeIn"
      [class.text-green-700]="notifyType === 'success'" [class.bg-green-50]="notifyType === 'success'"
      [class.text-red-700]="notifyType === 'error'" [class.bg-red-50]="notifyType === 'error'">
      {{ notifyMessage }}
    </div>

    <button type="submit" [disabled]="registerForm.invalid"
      class="w-full py-3 bg-sky-500 text-white font-extrabold text-lg rounded-lg mt-5 transition duration-300 hover:bg-sky-600 
             disabled:bg-gray-200 disabled:text-gray-500 disabled:cursor-not-allowed transform hover:scale-[1.01]">
      ĐĂNG KÝ
    </button>

    <div class="mt-6 text-center text-sm text-gray-600">
      <p>
        Bạn đã có tài khoản? 
        <a (click)="openLogin()" class="text-sky-500 font-bold hover:underline cursor-pointer transition">Đăng nhập ngay</a>
      </p>
    </div>
  </form>
</div>
