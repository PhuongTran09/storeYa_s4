<div class="flex justify-center items-center p-6 px-6">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()"
    class="bg-white py-4 rounded-xl w-full max-w-[400px]">
    <!-- Title -->
    <h2 class="mb-6 text-center font-bold text-2xl text-blue-600">
      REGISTER
    </h2>

    <!-- Username -->
    <div class="mb-4">
      <div class="text-red-500 text-xs" *ngIf="errorMessages['username']">
        {{ errorMessages['username'] }}
      </div>
      <input id="username" type="text" formControlName="username" placeholder="Username"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition"
        [ngClass]="{ 'border-red-500': registerForm.get('username')?.touched && registerForm.get('username')?.invalid }" />
    </div>

    <!-- Email -->
    <div class="mb-4">
      <div class="text-red-500 text-xs" *ngIf="errorMessages['email']">
        {{ errorMessages['email'] }}
      </div>
      <input id="email" type="email" formControlName="email" placeholder="Email"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition"
        [ngClass]="{ 'border-red-500': registerForm.get('email')?.touched && registerForm.get('email')?.invalid }" />
    </div>

    <!-- First + Last Name -->
    <div class="mb-4">
      <div class="text-red-500 text-xs" *ngIf="errorMessages['firstName'] || errorMessages['lastName']">
        {{ errorMessages['firstName'] || errorMessages['lastName'] }}
      </div>
      <div class="grid grid-cols-2 gap-3">
        <input id="firstName" type="text" formControlName="firstName" placeholder="First Name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition" />
        <input id="lastName" type="text" formControlName="lastName" placeholder="Last Name"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition" />
      </div>
    </div>

    <!-- Password -->
    <div class="mb-4 relative">
      <div class="text-red-500 text-xs" *ngIf="errorMessages['password']">
        {{ errorMessages['password'] }}
      </div>
      <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password"
        (focus)="passwordFocused = true" (blur)="passwordFocused = false"
        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:border-blue-600 focus:outline-none transition pr-10" />
      <span *ngIf="passwordFocused || registerForm.get('password')?.value" (click)="togglePasswordVisibility()"
        class="absolute top-1/2 right-3 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-blue-600">
        <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
      </span>
    </div>

    <!-- Notify -->
    <div *ngIf="notifyMessage" class="text-xs mt-0 mb-2 animate-fadeIn"
      [class.text-green-500]="notifyType === 'success'" [class.text-red-500]="notifyType === 'error'">
      {{ notifyMessage }}
    </div>

    <!-- Submit -->
    <button type="submit" [disabled]="registerForm.invalid"
      class="w-full py-3 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 transition disabled:bg-gray-300 disabled:cursor-not-allowed">
      Register
    </button>

    <!-- Link -->
    <div class="mt-4 text-center text-sm">
      <p>
        Have an account?
        <a (click)="openLogin()" class="text-blue-600 hover:underline cursor-pointer">
          Login
        </a>
      </p>
    </div>
  </form>
</div>
