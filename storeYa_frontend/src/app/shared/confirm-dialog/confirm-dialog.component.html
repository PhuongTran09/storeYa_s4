<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-lg shadow-lg w-96 p-6 text-center relative animate-slide-down">
    <h3 class="text-lg font-semibold mb-4 text-gray-700">{{ title }}</h3>
    <p class="text-sm text-gray-600 mb-6">{{ message }}</p>
    <div class="flex justify-center gap-4">
      <button (click)="confirm()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
        {{ confirmText }}
      </button>
      <button (click)="cancel()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400">
        {{ cancelText }}
      </button>
    </div>
  </div>
</div>
