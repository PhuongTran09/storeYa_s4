<div class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-50 transition-opacity duration-300">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-8 text-center relative 
                transform transition-transform duration-300 ease-out scale-100 animate-slide-up border border-gray-100">
        
        <div class="mx-auto mb-4 w-12 h-12 flex items-center justify-center rounded-full bg-sky-100">
             <i class="fa-solid fa-circle-question text-xl text-sky-500"></i>
        </div>
        
        <h3 class="text-xl font-extrabold mb-3 text-gray-900">
            {{ title }}
        </h3>
        
        <p class="text-sm text-gray-600 mb-6">
            {{ message }}
        </p>
        
        <div class="flex justify-center gap-3">
            
            <button (click)="cancel()" 
                    class="flex-1 px-4 py-2.5 bg-gray-100 text-gray-700 font-semibold rounded-lg 
                           transition duration-200 hover:bg-gray-200 hover:text-gray-800">
                {{ cancelText }}
            </button>

            <button (click)="confirm()" 
                    class="flex-1 px-4 py-2.5 bg-sky-500 text-white font-semibold rounded-lg 
                           transition duration-200 hover:bg-sky-600 focus:ring-2 focus:ring-sky-200">
                {{ confirmText }}
            </button>
        </div>
    </div>
</div>
