<nav class="w-full bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-full mx-auto flex items-center justify-between px-6 py-3">

    <a routerLink="/admin/dashboard" class="flex items-center gap-2 text-xl font-extrabold text-sky-500 transition hover:text-sky-600">
      <i class="fa-solid fa-chart-simple text-2xl"></i>
      <span class="hidden sm:inline">YA ADMIN DASHBOARD</span>
    </a>

    <form class="relative mx-4 flex-1 max-w-xl hidden md:block">
      <input type="search" placeholder="Tìm kiếm đơn hàng, sản phẩm, người dùng..." 
             class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg shadow-sm text-sm 
                    focus:ring-2 focus:ring-sky-500 focus:border-sky-500 
                    outline-none transition duration-200" />
      <button type="submit" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-sky-600">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </form>

    <div class="flex items-center gap-3 sm:gap-4">
      
      <button class="text-gray-500 hover:text-sky-600 transition p-2 rounded-full hover:bg-gray-100">
        <i class="fa-solid fa-bell text-lg"></i>
      </button>

      <div class="flex items-center gap-2 cursor-pointer group">
        <span class="text-gray-800 font-semibold text-sm hidden lg:inline">
            {{ username }}
        </span>
        <i class="fa-solid fa-user-circle text-2xl text-sky-500"></i>
      </div>
      
      <button (click)="logout()"
        class="px-4 py-2 text-sm bg-sky-500 text-white font-medium rounded-lg 
               transition duration-200 hover:bg-sky-600 focus:ring-2 focus:ring-sky-200">
        <i class="fa-solid fa-right-from-bracket mr-1"></i>
        Logout
      </button>
    </div>
  </div>
</nav>

<app-confirm-dialog *ngIf="showLogoutConfirm" 
                    [title]="'Xác nhận Đăng xuất'" 
                    [message]="'Bạn có chắc chắn muốn đăng xuất khỏi hệ thống quản trị?'"
                    [confirmText]="'Đồng ý'" 
                    [cancelText]="'Hủy'" 
                    (confirmed)="onConfirmLogout()"
                    (cancelled)="onCancelLogout()">
</app-confirm-dialog>
